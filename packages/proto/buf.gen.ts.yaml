version: v2

# TS 側 (center = apps/hub) の codegen ターゲット。生成先は apps/hub/src/gen:
#
#   buf generate packages/proto --template packages/proto/buf.gen.ts.yaml -o apps/hub/src/gen
#
# Go 側 (buf.gen.yaml) と同じく生成物は commit し、drift は CI が regenerate 後の
# `git diff --exit-code` で捕まえる。版を固定するのも同じ理由 — 固定しないと BSR 側の
# plugin 更新で生成物が黙って変わり、無関係な PR で drift 検出が落ちる。
#
# React UI 用の connect-query binding はここに置かない。UI (#46) がまだ無く、誰も
# consume しない生成物は間違っていても何も壊れない = 検証されない生成物になるため。
# (#91 以前にこのファイルへ書いてあったのは buf.build/bufbuild/connect-query で、
# 実際に生成すると protobuf-es v2 と噛み合わない v0.4.1 の出力が出た。UI を作る
# ときに、そのとき正しい plugin を、生成物を consume する PR で入れる。)
plugins:
  # メッセージ型 + サービス記述子。connect-es v2 はこの記述子を直接 consume する
  # ので、別途 connect 用 plugin は要らない。
  - remote: buf.build/bufbuild/es:v2.14.0
    out: ts
    opt: target=ts
