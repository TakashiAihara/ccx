syntax = "proto3";

package ccx.v1;

import "google/protobuf/timestamp.proto";

// Delivers a message to a running session (#301 / #302).
//
// The sender calls the same service whatever product the receiver is; ccx-agent picks how to get the
// message there. The sender picks how the message is read (mode), not how it is delivered. A mode the
// receiver does not have is refused, never quietly swapped for a nearby one.
//
// It writes into other sessions, so it is served on the unix socket only (same user, mode 0600), never on
// AgentService's TCP listener: there, anyone holding the API token could type into any session on this
// host. Other hosts go through the center (#138).
service MessageService {
  // Sends one message and streams the acks in the order they happen. A target that is not found, an
  // input box with text in it, or a mode the receiver lacks sends nothing and comes back as an error
  // (NOT_FOUND / FAILED_PRECONDITION / INVALID_ARGUMENT; UNAVAILABLE when herdr cannot be asked). The
  // error text is for people; for a missing mode it lists the modes the receiver has. An error from
  // before anything was typed carries the metadata `Ccx-Not-Typed: 1`. Any other error, or a stream
  // that breaks, may come after the text went in: do not resend without looking.
  rpc Send(SendRequest) returns (stream SendResponse);

  // One Devin hook event, from `ccx-agent devin-hook` that Devin runs (UserPromptSubmit / PreToolUse /
  // PostToolUse / Stop). The agent reads it for the question / done acks and, on UserPromptSubmit, answers
  // with the later messages to put into that turn. Nothing goes to the center.
  rpc DevinHook(DevinHookRequest) returns (DevinHookResponse);
}

message DevinHookRequest {
  // The hook's stdin as Devin wrote it (JSON).
  bytes payload = 1;
}

message DevinHookResponse {
  // What the hook prints on stdout for Devin. Empty prints nothing.
  string output = 1;
}

// How the receiver reads it (the three decided on #301).
enum DeliveryMode {
  // Unspecified is taken as AFTER_TURN.
  DELIVERY_MODE_UNSPECIFIED = 0;
  // Does not wake the receiver; read on its next turn.
  DELIVERY_MODE_LATER = 1;
  // Read after the receiver finishes its current work; now if it is idle.
  DELIVERY_MODE_AFTER_TURN = 2;
  // Read at the next break even while the receiver is working.
  DELIVERY_MODE_URGENT = 3;
}

message SendRequest {
  // The receiver's session name. For Devin, its session name (the herdr pane's agent_session).
  string target = 1;
  DeliveryMode mode = 2;
  // Shown to the receiver as the line `ccx: <sender>: <summary>`. One line, at most 80 bytes.
  string summary = 3;
  // UTF-8 text up to 64 KiB, with no control characters but newline and tab.
  string body = 4;
  // The sender's name. Only shown in that line, never used for auth. One line, at most 40 bytes.
  string sender = 5;
  // The machine and OS user whose ccx-agent delivers it. Empty means this ccx-agent's own. Any other goes
  // through the center (MessageRelayService, #138), and that ccx-agent delivers it as if sent to it locally.
  string machine = 6;
  string user = 7;
  // How long, in seconds, to keep the stream open after sent for the receiver's question / done (up to 3600).
  // 0 ends after working / not-started, as before. For later it is how long to wait for the receiver's next
  // turn to take it. Needs Devin's hooks wired to `ccx-agent devin-hook`.
  uint32 wait_seconds = 8;
}

// A question the receiver put to its user (Devin's ask_user_question).
message Question {
  string question = 1;
  string header = 2;
  repeated Option options = 3;

  message Option {
    string label = 1;
    string description = 2;
  }
}

message SendResponse {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Taken as the receiver's input: the line shows in its history and its input box is empty again.
    STATE_SENT = 1;
    // The receiver started working on it.
    STATE_WORKING = 2;
    // No sign of the receiver starting within the wait. It does not mean the message was lost.
    STATE_NOT_STARTED = 3;
    // later: kept by ccx-agent for the receiver's next turn. The stream ends here unless wait_seconds is set,
    // and then SENT follows when a turn takes it.
    STATE_QUEUED = 4;
    // The receiver, working on it, asked its user a question (questions). Its turn goes on once answered.
    STATE_QUESTION = 5;
    // The receiver's turn that took the message ended; text is its last answer. The stream ends.
    STATE_DONE = 6;
  }
  State state = 1;
  // One line for people about the state. May be empty.
  string detail = 2;
  // Set with QUESTION.
  repeated Question questions = 3;
  // Set with DONE: the receiver's last answer, whole.
  string text = 4;
}

// Carries a message to another machine's ccx-agent (#138). Served by the center.
//
// The sender's ccx-agent puts the message and reads it back for the acks; the receiver's ccx-agent claims it,
// delivers it as a local Send, and reports each ack. The center does not connect to a ccx-agent for this (it
// may wake one, as for resume): the connections go ccx-agent -> center, as for ingest.
//
// A message is handed out once. One claimed and never finished is not handed out again, so it is never typed
// twice; the sender then ends as "may have been sent". One not claimed within 30 seconds is expired and never
// handed out, so the sender can say "not sent".
//
// Anyone holding the center's token can put, claim and read a message for any machine, the same reach as
// resume.
service MessageRelayService {
  // Stores a message for request.machine / request.user. Both are required.
  rpc PutMessage(PutMessageRequest) returns (PutMessageResponse);
  // Reads one back by id, acks included. NOT_FOUND for an unknown id.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  // Hands the oldest unclaimed, unexpired message for (machine, user) to the caller. None leaves message unset.
  rpc ClaimMessage(ClaimMessageRequest) returns (ClaimMessageResponse);
  // Replaces the acks of a claimed message with the reported ones unless they are fewer than the stored ones
  // (a late report), and finishes it when finished is set. FAILED_PRECONDITION for a message that is not
  // claimed, already finished, or claimed with another claim_token.
  rpc ReportMessage(ReportMessageRequest) returns (ReportMessageResponse);
}

message RelayedMessage {
  // Set by the center (UUIDv7).
  string id = 1;
  // As the sender gave it; machine and user name the receiver.
  SendRequest request = 2;
  google.protobuf.Timestamp put_at = 3;
  // Unset until a ccx-agent claimed it.
  google.protobuf.Timestamp claimed_at = 4;
  // Unset until the receiver reported the end.
  google.protobuf.Timestamp finished_at = 5;
  // The acks so far, in order.
  repeated SendResponse acks = 6;
  // The receiver's error, once finished: a Connect code (0 means it ended without an error) and its message.
  int32 error_code = 7;
  string error_message = 8;
  // The error came before anything was typed (MessageService's Ccx-Not-Typed).
  bool not_typed = 9;
  // Not claimed within 30 seconds of being put. It will not be handed out.
  bool expired = 10;
  // Only in ClaimMessage's answer: the receiver gives it back in ReportMessage.
  string claim_token = 11;
}

message PutMessageRequest {
  SendRequest request = 1;
}

message PutMessageResponse {
  RelayedMessage message = 1;
}

message GetMessageRequest {
  string id = 1;
}

message GetMessageResponse {
  RelayedMessage message = 1;
}

message ClaimMessageRequest {
  // The caller's own origin (ingest.proto's Origin).
  string machine = 1;
  string user = 2;
}

message ClaimMessageResponse {
  RelayedMessage message = 1;
}

message ReportMessageRequest {
  string id = 1;
  string claim_token = 2;
  // All the acks so far, not only the new ones, so a resent report does no harm.
  repeated SendResponse acks = 3;
  bool finished = 4;
  int32 error_code = 5;
  string error_message = 6;
  bool not_typed = 7;
}

message ReportMessageResponse {}
