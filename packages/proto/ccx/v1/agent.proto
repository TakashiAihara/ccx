syntax = "proto3";

package ccx.v1;

import "ccx/v1/fleet.proto";
import "google/protobuf/timestamp.proto";

// ccx-agent に状態を問い合わせる口 (kaneo ccx#34)。
//
// 同じ handler を 2 つの listener に載せる。unix socket (同じホストの statusline 用、
// パーミッション 0600 で守る) と TCP (別ホストの ccx-agent 用、既定 off、API token を
// 要求。center への書き込み権限を持つ hub token とは分ける)。プロトコルを 1 つにするのは、
// 項目を足すたびに 2 か所を変えないため。
//
// 読むだけの口。ここから agent の状態を変える RPC は置かない。Wake は agent の状態を書き換えないが、
// center への ClaimResume を 1 回起こす (依頼があればその先で session が開く)。叩く回数は制限していないので、
// API token を持つ人は ClaimResume を何度でも起こせる。
service AgentService {
  // 1 session の、表示に要る状態。agent しか持たないもの (heartbeat の登録・次回・回数、
  // spool の滞留、center への到達) と、そのマシンのファイルにある宣言状態を 1 回で返す。
  rpc GetSessionStatus(GetSessionStatusRequest) returns (GetSessionStatusResponse);

  // center が「このマシン宛ての再開依頼を置いた」ときに叩く起こしの合図 (#261)。agent は次の polling を
  // 待たずに ClaimResume を 1 回打つ。依頼そのものは運ばない (受け取りの経路は ClaimResume の 1 本だけ)。
  // 合図が届かなくても、次の polling が同じ依頼を拾う。center が叩けるのは、agent が実行中一覧の報告に
  // api_url を載せた (CCX_API_URL / [api] url を設定した) マシンだけで、TCP の口と同じ API token が要る。
  rpc Wake(WakeRequest) returns (WakeResponse);
}

// 中身は無い。宛先は叩かれた agent 自身で、どの依頼かは ClaimResume が決める。
message WakeRequest {}

// 合図を受け取ったことだけを返す。依頼を取れたか・開けたかは返さない (それは ResumeRequest に残る)。
message WakeResponse {}

message GetSessionStatusRequest {
  // Claude Code の session id (8-4-4-4-12、小文字)。先頭一致は受けない。
  string session_id = 1;
  // その session の CLAUDE_CONFIG_DIR。空または相対なら agent の既定 (~/.claude)。
  // agent は systemd の下で別の環境を持つので、session 側が知っている値を渡す。
  // channel が登録済みの session なら、登録時の値が優先される (宣言状態も heartbeat も
  // 同じ home から読む)。unix socket でだけ効く: TCP では無視する (別ホストの呼び手は
  // このホストの値を知らず、任意のディレクトリを読ませる口になるため)。
  string claude_home = 2;
}

message GetSessionStatusResponse {
  // そのマシンのファイルにある宣言状態 (docs/design/session-state.md)。
  SessionState declared = 1;
  HeartbeatStatus heartbeat = 2;
  CollectStatus collect = 3;
}

message HeartbeatStatus {
  // heartbeat concern が設定で on か (CollectStatus.enabled と同じ意味)。false なら
  // 以下は宣言の値を除いて空。
  bool enabled = 1;
  // channel socket を受けているか。enabled でも socket を開けなければ false で、その
  // 間は打てない。
  bool listening = 8;
  // この session の宣言 ("on" / "off" / 空 = agent の既定に従う)。
  string declared = 2;
  // 宣言と agent の既定から決まる「打つべきか」。archived なら false。
  bool wanted = 3;
  // channel が agent に繋がっているか。false なら打つ経路が無い。
  bool registered = 4;
  // 次に打つ予定の時刻。予定が無い (打たない / 既に期限切れ / turn の実行中 / 打った
  // 直後で transcript への着地待ち) なら未設定。
  google.protobuf.Timestamp next_at = 5;
  // この登録 (channel の接続) の間に打った回数と、最後に打った時刻。
  uint32 sent = 6;
  google.protobuf.Timestamp last_sent_at = 7;
  // 予定を入れない理由。"not_wanted" (打たない宣言 / archived / 宣言が無く agent の既定が off) /
  // "short_ttl" (最後のリクエストが 5 分の cache を書いた) / "expired" (cache が既に切れた) /
  // "turn_running" (turn の実行中) / "max_idle" (使われないまま max_idle を超えた) /
  // "beat_pending" (打った heartbeat が transcript に届くのを待っている) / "push_failed" (push が失敗した。
  // 次の見直しでもう一度打つ) / "no_request" (応答のある request がまだ無い。最初のプロンプトの前で
  // transcript がまだ無い session もこれ) / "transcript_unreadable" (transcript はあるが読めない)。
  // 空になるのは、予定がある (next_at が設定済み) か、未登録か、enabled が false のときだけ
  // (理由の値を持たない古い agent と、登録直後で最初の見直しがまだの一瞬も空を返す)。打った直後は次の見直し (最大 1 分) まで "beat_pending" に
  // なるので、正常に回っている session でも約 50 分に 1 分はこの値を返す。
  // next_at と同じく agent が 1 分ごとに見直すので、最大 1 分遅れる。
  string idle_reason = 9;
  // heartbeat 以外の最後の記録 (人のプロンプト、heartbeat 以外の channel の event、別 session からの
  // message) より後に
  // transcript へ届いた heartbeat の数。プロンプトで 0 に戻る。sent と違い agent の再起動では
  // 戻らない (transcript から数える)。transcript を読めなかった回は直前の値のまま (起動後に一度も
  // 読めていなければ 0)。next_at と同じく最大 1 分遅れる。未登録なら 0。
  uint32 beats_since_real = 10;
  // transcript に届いた最後の heartbeat の時刻 (#274)。届いたものが無ければ未設定。sent / last_sent_at と違い
  // transcript から読むので、agent の再起動では消えない。transcript を読めなかった回は直前の値のまま。
  // 未登録なら未設定。
  google.protobuf.Timestamp last_beat_at = 11;
  // cache を書いた最後の request が書いた TTL: "5m" / "1h"。cache を書いた request がまだ無ければ空。
  // "5m" の間は heartbeat を打たない (idle_reason は、打たない宣言や応答待ちが先に当たらなければ "short_ttl")。
  // transcript を読めなかった回は直前の値のまま。
  // 未登録なら空。
  string cache_ttl = 12;
}

message CollectStatus {
  // collect concern が設定で on か。false なら以下は空。
  bool enabled = 1;
  // center の URL が設定されているか。false なら spool に溜めるだけで送らない。
  bool center_configured = 2;
  // spool に残っている (center に届いていない) event の数。
  uint32 pending = 3;
  // 最後に center に届いた時刻と、最後に届かなかった時刻・理由。agent の起動後の値。
  // last_error は後で届いても消えない。今も届いていないかは last_error_at と
  // last_forwarded_at を比べて読む。
  google.protobuf.Timestamp last_forwarded_at = 4;
  google.protobuf.Timestamp last_error_at = 5;
  string last_error = 6;
  // spool が読めなかったときの理由。そのとき pending は 0 で、意味を持たない。
  string spool_error = 7;
}
